apiVersion: v1
kind: Service
metadata:
  name: {{ include "randomtasktrack.fullname" . }}-api
  labels:
    {{- include "randomtasktrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "randomtasktrack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "randomtasktrack.fullname" . }}-api
  labels:
    {{- include "randomtasktrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "randomtasktrack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Roll the pods when a secret changes; a Secret edit alone would not.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "randomtasktrack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Keeps the compose guarantee that the API never starts against an
        # un-migrated database. tracker.task_domains is seeded by v0.00, so it
        # only answers once the migrate Job has finished.
        - name: wait-for-migrations
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - until psql -c 'select 1 from tracker.task_domains limit 1' >/dev/null 2>&1; do echo "waiting for migrations..."; sleep 3; done
          env:
            {{- include "randomtasktrack.pgEnv" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "randomtasktrack.image" (dict "ctx" $ "repository" .Values.api.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "randomtasktrack.secretName" . }}
                  key: connection-string
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "randomtasktrack.secretName" . }}
                  key: jwt-secret-key
            - name: Jwt__Issuer
              value: {{ .Values.jwt.issuer | quote }}
            - name: Jwt__Audience
              value: {{ .Values.jwt.audience | quote }}
            - name: Jwt__ExpiryInMinutes
              value: {{ .Values.jwt.expiryInMinutes | quote }}
            - name: Ai__Provider
              value: {{ .Values.ai.provider | quote }}
            - name: Ai__Model
              value: {{ .Values.ai.model | quote }}
            - name: Ai__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "randomtasktrack.secretName" . }}
                  key: ai-api-key
            - name: Ai__MaxTokens
              value: {{ .Values.ai.maxTokens | quote }}
            - name: Ai__WebSearch
              value: {{ .Values.ai.webSearch | quote }}
            - name: Ai__ProviderOptions__effort
              value: {{ .Values.ai.effort | quote }}
            - name: Recipes__Provider
              value: {{ .Values.recipes.provider | quote }}
            - name: Recipes__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "randomtasktrack.secretName" . }}
                  key: recipe-api-key
            - name: Finance__BaseCurrency
              value: {{ .Values.finance.baseCurrency | quote }}
            - name: Finance__Provider
              value: {{ .Values.finance.provider | quote }}
            - name: Scheduler__TimeZone
              value: {{ .Values.scheduler.timeZone | quote }}
            {{- if .Values.ingress.enabled }}
            # Same-origin through the ingress, so this is belt and braces — but
            # an empty allow-list makes Program.cs fall back to AllowAnyOrigin.
            - name: Cors__AllowedOrigins__0
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

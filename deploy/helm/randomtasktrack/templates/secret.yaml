apiVersion: v1
kind: Secret
metadata:
  name: {{ include "randomtasktrack.secretName" . }}
  labels:
    {{- include "randomtasktrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  jwt-secret-key: {{ required "secrets.jwtSecretKey is required (at least 32 characters)" .Values.secrets.jwtSecretKey | quote }}
  # Empty is supported: NullAiProvider is registered and chat returns a clear error.
  ai-api-key: {{ .Values.secrets.aiApiKey | quote }}
  # Assembled here rather than in the pod spec so the password never lands in a
  # ConfigMap or in `kubectl get deployment -o yaml`.
  connection-string: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s;SSL Mode=Disable;Pooling=true;Minimum Pool Size=1;Maximum Pool Size=20" (include "randomtasktrack.postgresHost" .) .Values.postgres.port .Values.postgres.database .Values.postgres.username .Values.secrets.dbPassword | quote }}

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-random_task_track}
      - POSTGRES_USER=${DB_USER:-rtt}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rtt} -d ${DB_NAME:-random_task_track}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot schema migration. Runs to completion, then exits — the api service
  # waits on it so it can never start against an un-migrated database.
  migrate:
    image: yuniql/cli:linux-x64-latest
    volumes:
      - ./migrations:/data
    # yuniql defaults to a 30 second command timeout, which is fine for DDL and
    # nowhere near enough for a scan of recipe_catalog: v0.05 regex-matches the
    # title, steps and ingredients of every row, and at two million rows that is
    # minutes. Past the timeout Npgsql drops the connection mid-statement and the
    # run fails with "Exception while reading from stream".
    command: >
      run --platform postgresql --auto-create-db
      --command-timeout 3600
      -c "Host=db;Port=5432;Database=${DB_NAME:-random_task_track};Username=${DB_USER:-rtt};Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
    ports:
      - "${API_PORT:-5080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__ConnectionString=Host=db;Port=5432;Database=${DB_NAME:-random_task_track};Username=${DB_USER:-rtt};Password=${DB_PASSWORD};SSL Mode=Disable;Pooling=true;Minimum Pool Size=1;Maximum Pool Size=20
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__Issuer=${JWT_ISSUER:-RandomTaskTrack}
      - Jwt__Audience=${JWT_AUDIENCE:-RandomTaskTrackClients}
      # 43200 minutes = 30 days. The tablet stays signed in.
      - Jwt__ExpiryInMinutes=${JWT_EXPIRY_MINUTES:-43200}
      - Ai__Provider=${AI_PROVIDER:-anthropic}
      - Ai__Model=${AI_MODEL:-claude-opus-5}
      - Ai__ApiKey=${AI_API_KEY:-}
      - Ai__MaxTokens=${AI_MAX_TOKENS:-16000}
      - Ai__ProviderOptions__effort=${AI_EFFORT:-high}
      - Recipes__Provider=${RECIPE_PROVIDER:-spoonacular}
      - Recipes__ApiKey=${RECIPE_API_KEY:-}
      - Finance__BaseCurrency=${FINANCE_BASE_CURRENCY:-EUR}
      - Finance__Provider=${FINANCE_PROVIDER:-yahoo}
      - Scheduler__TimeZone=${TIME_ZONE:-Europe/Vilnius}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:

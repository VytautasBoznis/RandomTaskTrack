server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Probe target. /api and /health belong to the API — the ingress routes
    # those away from this container before they ever get here.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
